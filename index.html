<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Liferoute - Debug Mode</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, monospace;
    overflow: hidden;
    background: #000;
}

#panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 16px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.95);
    color: #0f0;
    border-radius: 0 0 22px 22px;
}

h2 { margin: 0 0 12px; }

button {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 16px;
    background: #FFD700;
    color: #000;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
}

button.active { background: #0f0; color: #000; transform: scale(0.96); }

#status { margin-top: 12px; font-size: 14px; color: #fff; }

#loader {
    display: none;
    width: 35px;
    height: 35px;
    margin: 15px auto;
    border-radius: 50%;
    border: 5px solid #333;
    border-top: 5px solid #0f0;
    animation: spin 0.5s linear infinite;
}

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

#progressOuter {
    display: none;
    height: 10px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

#progress {
    width: 0%;
    height: 100%;
    background: #0f0;
    transition: width 0.2s ease;
}

#popup {
    display: none;
    position: absolute;
    z-index: 2000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.98);
    padding: 25px;
    width: 80%;
    max-width: 500px;
    border-radius: 20px;
    text-align: center;
    color: #0f0;
}

#debugOutput {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.95);
    color: #0f0;
    padding: 15px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 11px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    white-space: pre-wrap;
}

#map { height: 100vh; width: 100%; }

.debug-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 1001;
    background: #f00;
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
}
</style>
</head>

<body>
<div id="panel">
    <h2>Liferoute - DEBUG MODE</h2>
    <input id="folder" type="file" accept="image/*" webkitdirectory directory multiple hidden>
    <button id="button">Choose Photo Folder</button>
    <div id="status">Waiting for photos</div>
    <div id="loader"></div>
    <div id="progressOuter"><div id="progress"></div></div>
</div>

<div id="popup">
    <div id="popupText">Preparing</div>
</div>

<button class="debug-btn" onclick="toggleDebug()">Toggle Debug</button>
<div id="debugOutput"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
<script>
// ============================================
// DEBUG SYSTEM
// ============================================
const debugLogs = [];
const MAX_LOGS = 100;

function log(message, data = null) {
    const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
    const logEntry = `[${timestamp}] ${message}`;
    debugLogs.push(logEntry);
    if (debugLogs.length > MAX_LOGS) debugLogs.shift();
    
    if (data) {
        console.log(logEntry, data);
    } else {
        console.log(logEntry);
    }
    
    updateDebugDisplay();
}

function updateDebugDisplay() {
    const output = document.getElementById('debugOutput');
    if (output.style.display === 'block') {
        output.textContent = debugLogs.join('\n');
        output.scrollTop = output.scrollHeight;
    }
}

function toggleDebug() {
    const output = document.getElementById('debugOutput');
    output.style.display = output.style.display === 'block' ? 'none' : 'block';
    if (output.style.display === 'block') {
        updateDebugDisplay();
    }
}

// ============================================
// STATE
// ============================================
const state = {
    map: null,
    markers: [],
    lines: [],
    photos: [],
    routeSegments: []
};

// ============================================
// DOM
// ============================================
const elements = {
    folder: document.getElementById('folder'),
    button: document.getElementById('button'),
    status: document.getElementById('status'),
    loader: document.getElementById('loader'),
    progress: document.getElementById('progress'),
    progressOuter: document.getElementById('progressOuter'),
    popup: document.getElementById('popup'),
    popupText: document.getElementById('popupText')
};

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    state.map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(state.map);
    L.control.zoom({ position: 'bottomright' }).addTo(state.map);

    elements.button.onclick = () => elements.folder.click();
    elements.folder.addEventListener('change', async (e) => {
        await processFiles(e.target.files);
    });

    log('DEBUG MODE ACTIVE - Check console and debug panel');
});

// ============================================
// FILE PROCESSING
// ============================================
async function processFiles(fileList) {
    resetMap();
    debugLogs.length = 0;
    
    const files = [...fileList].filter(f => f.type.startsWith('image/')).slice(0, 500);
    if (files.length === 0) return;

    log(`Starting with ${files.length} files`);
    updateUI('loading', `Processing ${files.length} files...`);

    state.photos = await extractPhotosWithDebug(files);

    if (state.photos.length === 0) {
        log('NO PHOTOS WITH GPS FOUND!');
        updateUI('error', 'No GPS data found. Check debug output.');
        return;
    }

    log(`Found ${state.photos.length} photos with GPS data`);
    state.photos.sort((a, b) => a.date - b.date);
    state.routeSegments = buildTrips(state.photos);
    
    drawRoutes();
    drawMarkers();
    
    setTimeout(() => {
        const bounds = L.latLngBounds(state.photos.map(p => [p.lat, p.lng]));
        state.map.fitBounds(bounds, { padding: [60, 60] });
    }, 500);

    updateUI('complete', `${state.photos.length} locations found`);
}

// ============================================
// EXTRACTION WITH FULL DEBUGGING
// ============================================
async function extractPhotosWithDebug(files) {
    const results = [];
    let done = 0;

    for (const file of files) {
        log(`Processing: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);
        
        const data = await readPhotoWithFullDebug(file);
        if (data) {
            results.push(data);
            log(`  ✓ SUCCESS: lat=${data.lat.toFixed(6)}, lng=${data.lng.toFixed(6)}`);
        } else {
            log(`  ✗ FAILED: No GPS data extracted`);
        }
        
        done++;
        updateProgress(done, files.length);
        await new Promise(r => setTimeout(r, 0));
    }

    return results;
}

async function readPhotoWithFullDebug(file) {
    try {
        log(`  Parsing EXIF for ${file.name}...`);
        
        // Parse EVERYTHING to see what's available
        const exif = await exifr.parse(file);
        
        if (!exif) {
            log(`  No EXIF data found`);
            return null;
        }

        log(`  EXIF tags found: ${Object.keys(exif).length}`);
        
        // Log ALL GPS-related tags
        const gpsTags = Object.keys(exif).filter(k => 
            k.toLowerCase().includes('gps') || 
            k.toLowerCase().includes('lat') || 
            k.toLowerCase().includes('long')
        );
        
        if (gpsTags.length > 0) {
            log(`  GPS-related tags: ${gpsTags.join(', ')}`);
            gpsTags.forEach(tag => {
                log(`    ${tag}: ${JSON.stringify(exif[tag])}`);
            });
        } else {
            log(`  No GPS-related tags found`);
        }

        // Try to extract coordinates
        const coords = extractCoordinatesWithDebug(exif);
        if (!coords) {
            log(`  Could not extract coordinates from available data`);
            return null;
        }

        log(`  Coordinates extracted: lat=${coords.lat}, lng=${coords.lng}`);
        
        // Extract date
        const date = extractDateWithDebug(exif, file);
        log(`  Date: ${date.toISOString()}`);

        return {
            lat: coords.lat,
            lng: coords.lng,
            date: date,
            fileName: file.name
        };
    } catch (e) {
        log(`  ERROR: ${e.message}`);
        return null;
    }
}

function extractCoordinatesWithDebug(exif) {
    // Method 1: Direct decimal
    if (exif.latitude !== undefined && exif.longitude !== undefined) {
        log(`  Method 1: Direct decimal - lat=${exif.latitude}, lng=${exif.longitude}`);
        const lat = parseFloat(exif.latitude);
        const lng = parseFloat(exif.longitude);
        if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
    }

    // Method 2: Standard GPS tags
    if (exif.GPSLatitude && exif.GPSLongitude) {
        log(`  Method 2: Standard GPS tags`);
        log(`    GPSLatitude: ${JSON.stringify(exif.GPSLatitude)}`);
        log(`    GPSLongitude: ${JSON.stringify(exif.GPSLongitude)}`);
        log(`    GPSLatitudeRef: ${exif.GPSLatitudeRef}`);
        log(`    GPSLongitudeRef: ${exif.GPSLongitudeRef}`);
        
        const lat = convertDMSToDD(exif.GPSLatitude, exif.GPSLatitudeRef);
        const lng = convertDMSToDD(exif.GPSLongitude, exif.GPSLongitudeRef);
        if (lat !== null && lng !== null) {
            log(`    Converted to: lat=${lat}, lng=${lng}`);
            return { lat, lng };
        }
    }

    // Method 3: Nested GPSInfo
    if (exif.GPSInfo) {
        log(`  Method 3: Nested GPSInfo`);
        log(`    GPSInfo: ${JSON.stringify(exif.GPSInfo)}`);
        if (exif.GPSInfo.GPSLatitude && exif.GPSInfo.GPSLongitude) {
            const lat = convertDMSToDD(exif.GPSInfo.GPSLatitude, exif.GPSInfo.GPSLatitudeRef);
            const lng = convertDMSToDD(exif.GPSInfo.GPSLongitude, exif.GPSInfo.GPSLongitudeRef);
            if (lat !== null && lng !== null) {
                log(`    Converted to: lat=${lat}, lng=${lng}`);
                return { lat, lng };
            }
        }
    }

    // Method 4: Check for XMP GPS data
    if (exif.xmp) {
        log(`  Method 4: XMP data found`);
        log(`    XMP: ${JSON.stringify(exif.xmp)}`);
    }

    // Method 5: Brute force - check ALL keys for lat/lng patterns
    log(`  Method 5: Brute force search...`);
    for (const [key, value] of Object.entries(exif)) {
        const strValue = String(value).toLowerCase();
        if (strValue.match(/-?\d+\.\d+,\s*-?\d+\.\d+/) || 
            strValue.match(/-?\d+\.\d+\s+-?\d+\.\d+/)) {
            log(`    Suspicious value in ${key}: ${value}`);
        }
    }

    return null;
}

function convertDMSToDD(dms, hemisphere) {
    if (!dms || dms.length < 3) return null;

    try {
        const deg = typeof dms[0] === 'object' ? dms[0].num / dms[0].den : parseFloat(dms[0]);
        const min = typeof dms[1] === 'object' ? dms[1].num / dms[1].den : parseFloat(dms[1]);
        const sec = typeof dms[2] === 'object' ? dms[2].num / dms[2].den : parseFloat(dms[2]);

        if (isNaN(deg) || isNaN(min) || isNaN(sec)) return null;

        let dd = deg + (min / 60) + (sec / 3600);
        if (hemisphere === 'S' || hemisphere === 'W') dd = -dd;
        
        if (dd < -180 || dd > 180) return null;
        return dd;
    } catch (e) {
        return null;
    }
}

function extractDateWithDebug(exif, file) {
    const dateFields = ['DateTimeOriginal', 'DateTime', 'CreateDate', 'GPSDateStamp'];
    
    for (const field of dateFields) {
        if (exif[field]) {
            try {
                const date = new Date(exif[field]);
                if (!isNaN(date.getTime())) {
                    log(`  Date from ${field}: ${exif[field]} -> ${date.toISOString()}`);
                    return date;
                }
            } catch (e) {
                log(`  Failed to parse ${field}: ${exif[field]}`);
            }
        }
    }

    log(`  Using file modification date: ${new Date(file.lastModified).toISOString()}`);
    return new Date(file.lastModified);
}

// ============================================
// TRIP BUILDING
// ============================================
function buildTrips(points) {
    const trips = [];
    let current = [];

    for (let i = 0; i < points.length; i++) {
        const point = points[i];
        if (current.length === 0) {
            current.push(point);
            continue;
        }

        const previous = current[current.length - 1];
        const km = haversineDistance(previous, point);
        const hours = (point.date - previous.date) / 3600000;

        if (km > 100 || hours > 12) {
            trips.push(current);
            current = [];
        }
        current.push(point);
    }

    if (current.length > 0) trips.push(current);
    return trips;
}

function haversineDistance(a, b) {
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const x = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// ============================================
// RENDERING
// ============================================
function drawRoutes() {
    state.lines.forEach(line => state.map.removeLayer(line));
    state.lines = [];

    state.routeSegments.forEach(segment => {
        if (segment.length < 2) return;
        const coords = segment.map(p => [p.lat, p.lng]);
        const line = L.polyline([], {
            color: '#0f0',
            weight: 4,
            opacity: 0.8
        }).addTo(state.map);
        state.lines.push(line);
        animateLine(line, coords);
    });
}

function animateLine(line, coords) {
    let index = 0;
    const current = [];
    function step() {
        if (index >= coords.length) return;
        current.push(coords[index]);
        line.setLatLngs(current);
        index++;
        setTimeout(step, 40);
    }
    step();
}

function drawMarkers() {
    state.markers.forEach(m => state.map.removeLayer(m));
    state.markers = [];

    state.photos.forEach(photo => {
        const marker = L.circleMarker([photo.lat, photo.lng], {
            radius: 4,
            fillColor: '#0f0',
            color: '#0a0',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
        });
        state.markers.push(marker);
        marker.addTo(state.map);
    });
}

// ============================================
// UI
// ============================================
function updateUI(state, message) {
    switch (state) {
        case 'loading':
            elements.button.classList.add('active');
            elements.button.innerText = 'Scanning...';
            elements.loader.style.display = 'block';
            elements.progressOuter.style.display = 'block';
            elements.popup.style.display = 'block';
            elements.popupText.textContent = message;
            elements.status.textContent = message;
            break;
        case 'processing':
            elements.popupText.textContent = message;
            elements.status.textContent = message;
            break;
        case 'complete':
            elements.popupText.textContent = message;
            elements.status.textContent = message;
            setTimeout(() => elements.popup.style.display = 'none', 1500);
            finishButton();
            break;
        case 'error':
            elements.popupText.textContent = message;
            elements.status.textContent = message;
            finishButton();
            break;
    }
}

function updateProgress(done, total) {
    const percent = Math.round((done / total) * 100);
    elements.progress.style.width = `${percent}%`;
    elements.status.textContent = `Processing ${done}/${total} (${percent}%)`;
}

function finishButton() {
    elements.button.classList.remove('active');
    elements.button.innerText = 'Choose Photo Folder';
    elements.loader.style.display = 'none';
    elements.progressOuter.style.display = 'none';
    elements.progress.style.width = '0%';
}

function resetMap() {
    state.lines.forEach(line => state.map.removeLayer(line));
    state.markers.forEach(m => state.map.removeLayer(m));
    state.lines = [];
    state.markers = [];
    state.photos = [];
    state.routeSegments = [];
}
</script>
</body>
</html>
