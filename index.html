<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Route</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
* {
    box-sizing:border-box;
}

body {
    margin:0;
    font-family:system-ui, sans-serif;
    background:#000;
}

#top {
    position:absolute;
    z-index:1000;
    top:0;
    width:100%;
    padding:15px;
    background:white;
    border-radius:0 0 20px 20px;
}

h2 {
    margin:0 0 10px;
}

button {
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:18px;
}

#status {
    margin-top:10px;
    font-size:14px;
}

#map {
    height:100vh;
    width:100%;
}
</style>

</head>

<body>

<div id="top">

<h2>🌍 Life Route</h2>

<input 
id="photos"
type="file"
accept="image/*"
webkitdirectory
multiple
hidden>

<button onclick="photos.click()">
Choose Photo Folder
</button>

<div id="status">
Waiting for photos...
</div>

</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>


<script>

const map=L.map("map").setView([20,0],2);


L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);


let points=[];


const status=document.getElementById("status");


photos.addEventListener("change", async e=>{

    points=[];

    const files=[
        ...e.target.files
    ].filter(
        f=>f.type.startsWith("image/")
    );


    status.innerText=
    `Found ${files.length} photos`;


    const limit=Math.min(
        files.length,
        1000
    );


    for(
        let i=0;
        i<limit;
        i++
    ){

        try {

            const data=
            await exifr.gps(files[i]);


            if(data){

                points.push({

                    lat:data.latitude,
                    lng:data.longitude,

                    date:
                    files[i].lastModified

                });

            }

        }
        catch(err){

        }


        if(i%25===0){

            status.innerText=
            `Scanning ${i}/${limit}...`;

            await new Promise(
                r=>setTimeout(r,0)
            );

        }

    }


    status.innerText=
    `${points.length} locations found`;


    draw();

});



function draw(){

    let coords=[];


    points.forEach(p=>{

        coords.push([
            p.lat,
            p.lng
        ]);

    });


    if(coords.length){

        L.polyline(
            coords,
            {
                weight:4
            }
        ).addTo(map);


        map.fitBounds(coords);

    }
    else{

        alert(
        "No GPS photos found"
        );

    }

}

</script>

</body>
</html>
