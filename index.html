<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Liferoute</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    background: #fff;
}

#panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 16px;
    z-index: 1001;
    background: rgba(255, 255, 255, 0.98);
    color: #111;
    border-radius: 0 0 22px 22px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.1);
    backdrop-filter: blur(10px);
}

#panel h2 {
    margin: 0 0 12px;
    font-size: 24px;
    font-weight: 700;
}

#status {
    margin-top: 12px;
    font-size: 14px;
    color: #666;
}

button {
    width: 100%;
    padding: 16px 24px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #111;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    touch-action: manipulation;
}

button:active { transform: scale(0.96); }
button.active { background: #111; color: #FFD700; }

#loader {
    display: none;
    width: 35px;
    height: 35px;
    margin: 15px auto;
    border-radius: 50%;
    border: 5px solid #eee;
    border-top: 5px solid #111;
    animation: spin 0.5s linear infinite;
}

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

#progressOuter {
    display: none;
    height: 10px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

#progress { width: 0%; height: 100%; background: linear-gradient(90deg, #FFD700, #FFA500); transition: width 0.2s; }

#popup {
    display: none;
    position: absolute;
    z-index: 2000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    padding: 25px;
    width: 85%;
    max-width: 400px;
    border-radius: 20px;
    text-align: center;
    color: #111;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

#popupText { font-size: 16px; }

#map { height: 100vh; width: 100%; }

@media (max-width: 768px) {
    #panel h2 { font-size: 20px; }
    button { font-size: 16px; padding: 14px 20px; }
}

html, body { overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
.leaflet-container { -webkit-tap-highlight-color: rgba(255, 255, 255, 0); }
.leaflet-control-attribution { background: transparent; color: rgba(0, 0, 0, 0.5); font-size: 11px; }
.leaflet-control-zoom { border: none; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }
.leaflet-control-zoom a { background: rgba(255, 255, 255, 0.9); color: #111; border: none; }
.leaflet-control-zoom a:hover { background: #FFD700; }
</style>
</head>

<body>
<div id="panel">
    <h2>Liferoute</h2>
    <input id="folder" type="file" accept="image/*" webkitdirectory directory multiple hidden>
    <button id="button">Choose Photo Folder</button>
    <div id="status">Waiting for photos</div>
    <div id="loader"></div>
    <div id="progressOuter"><div id="progress"></div></div>
</div>

<div id="popup">
    <div id="popupText">Preparing</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script>
// ============================================
// CONFIG
// ============================================
const CONFIG = {
    MAX_FILES: 2000,
    DEDUP_DISTANCE_MILES: 30,  // Deduplicate points within 30 miles
    MAX_WORKERS: 8,
    MIN_WORKERS: 2,
    BATCH_SIZE: 50
};

// ============================================
// STATE
// ============================================
let map;
let routePoints = [];
let markers = [];
let lines = [];
let statusEl, folderInput, button, loader, progress, progressOuter, popup, popupText;
let deviceTier = 'low';  // Will be detected

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    // Detect device capability
    detectDeviceTier();
    
    map = L.map('map', {
        zoomControl: false,
        doubleClickZoom: false,
        gestureHandling: true,
        tap: true
    }).setView([20, 0], 2);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Cache DOM
    statusEl = document.getElementById('status');
    folderInput = document.getElementById('folder');
    button = document.getElementById('button');
    loader = document.getElementById('loader');
    progress = document.getElementById('progress');
    progressOuter = document.getElementById('progressOuter');
    popup = document.getElementById('popup');
    popupText = document.getElementById('popupText');

    button.onclick = () => folderInput.click();
    folderInput.addEventListener('change', handleFiles);

    document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
});

// ============================================
// DEVICE DETECTION
// ============================================
function detectDeviceTier() {
    // Check number of CPU cores
    const cores = navigator.hardwareConcurrency || 2;
    
    // Check memory
    const memory = navigator.deviceMemory || 2;
    
    // Check if mobile
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // Assign tier
    if (cores >= 6 && memory >= 6 && !isMobile) {
        deviceTier = 'high';
    } else if (cores >= 4 && memory >= 4) {
        deviceTier = 'medium';
    } else {
        deviceTier = 'low';
    }
    
    console.log(`Device tier: ${deviceTier} (cores: ${cores}, memory: ${memory}GB, mobile: ${isMobile})`);
}

function getWorkerCount() {
    // Custom worker count based on device tier
    switch (deviceTier) {
        case 'high': return Math.min(CONFIG.MAX_WORKERS, navigator.hardwareConcurrency || CONFIG.MAX_WORKERS);
        case 'medium': return Math.min(4, navigator.hardwareConcurrency || 4);
        case 'low': return CONFIG.MIN_WORKERS;
        default: return 4;
    }
}

// ============================================
// FILE HANDLING
// ============================================
async function handleFiles(e) {
    resetMap();
    
    const files = [...e.target.files]
        .filter(f => f.type.startsWith('image/'))
        .slice(0, CONFIG.MAX_FILES);

    if (files.length === 0) {
        updateStatus('No image files found');
        return;
    }

    updateStatus(`Found ${files.length} images, scanning...`);
    updateUI('loading');

    const workerCount = getWorkerCount();
    console.log(`Using ${workerCount} workers for processing`);
    
    routePoints = await processFilesInParallel(files, workerCount);

    if (routePoints.length === 0) {
        updateUI('error', 'No GPS data found. Ensure location was enabled when photos were taken.');
        return;
    }

    // Deduplicate points within 30 miles
    const deduplicatedPoints = deduplicatePoints(routePoints, CONFIG.DEDUP_DISTANCE_MILES);
    const removed = routePoints.length - deduplicatedPoints.length;
    
    if (removed > 0) {
        console.log(`Deduplicated ${removed} points within ${CONFIG.DEDUP_DISTANCE_MILES} miles`);
    }
    
    routePoints = deduplicatedPoints;

    updateUI('processing', 'Sorting and drawing...');
    
    routePoints.sort((a, b) => new Date(a.date) - new Date(b.date));
    
    drawRoute();
    
    updateUI('complete', `${routePoints.length} locations found`);
}

// ============================================
// DEDUPLICATION
// ============================================
function deduplicatePoints(points, maxDistanceMiles) {
    if (points.length <= 1) return points;
    
    const uniquePoints = [points[0]];
    const maxDistanceKm = maxDistanceMiles * 1.60934;  // Convert miles to km
    
    for (let i = 1; i < points.length; i++) {
        const current = points[i];
        let isDuplicate = false;
        
        // Check against all unique points so far
        for (const unique of uniquePoints) {
            const distanceKm = haversineDistance(current, unique);
            if (distanceKm <= maxDistanceKm) {
                isDuplicate = true;
                break;
            }
        }
        
        if (!isDuplicate) {
            uniquePoints.push(current);
        }
    }
    
    return uniquePoints;
}

// ============================================
// PARALLEL PROCESSING
// ============================================
async function processFilesInParallel(files, workerCount) {
    const results = [];
    const total = files.length;
    let processed = 0;

    const workerPromises = [];
    const chunkSize = Math.ceil(files.length / workerCount);

    for (let i = 0; i < workerCount; i++) {
        const start = i * chunkSize;
        const end = Math.min(start + chunkSize, files.length);
        const chunk = files.slice(start, end);
        
        if (chunk.length > 0) {
            workerPromises.push(processChunk(chunk, (count) => {
                processed += count;
                updateProgress(processed, total);
            }));
        }
    }

    const allResults = await Promise.all(workerPromises);
    return allResults.flat();
}

async function processChunk(files, onProgress) {
    const results = [];
    
    for (const file of files) {
        try {
            const data = await extractGPS(file);
            if (data) {
                results.push(data);
            }
        } catch (e) {
            console.warn(`Error processing ${file.name}:`, e);
        }
        
        if (results.length % CONFIG.BATCH_SIZE === 0) {
            onProgress(CONFIG.BATCH_SIZE);
            await new Promise(r => setTimeout(r, 0));
        }
    }
    
    onProgress(files.length % CONFIG.BATCH_SIZE);
    return results;
}

// ============================================
// GPS EXTRACTION
// ============================================
async function extractGPS(file) {
    try {
        // Method 1: Use gps:true for automatic conversion
        const data = await exifr.parse(file, {
            gps: true,
            DateTimeOriginal: true
        });

        if (data && data.latitude !== undefined && data.longitude !== undefined) {
            return {
                lat: parseFloat(data.latitude),
                lng: parseFloat(data.longitude),
                date: data.DateTimeOriginal || file.lastModified,
                fileName: file.name
            };
        }
        
        // Method 2: Manual DMS conversion
        const exif = await exifr.parse(file);
        
        if (exif && exif.GPSLatitude && exif.GPSLongitude) {
            const lat = convertDMS(exif.GPSLatitude, exif.GPSLatitudeRef);
            const lng = convertDMS(exif.GPSLongitude, exif.GPSLongitudeRef);
            
            if (lat !== null && lng !== null) {
                return {
                    lat: lat,
                    lng: lng,
                    date: exif.DateTimeOriginal || file.lastModified,
                    fileName: file.name
                };
            }
        }
        
        return null;
    } catch (e) {
        console.warn(`GPS extraction failed for ${file.name}:`, e);
        return null;
    }
}

function convertDMS(dms, hemisphere) {
    if (!dms || dms.length < 3) return null;
    
    try {
        const deg = typeof dms[0] === 'object' ? dms[0].num / dms[0].den : parseFloat(dms[0]);
        const min = typeof dms[1] === 'object' ? dms[1].num / dms[1].den : parseFloat(dms[1]);
        const sec = typeof dms[2] === 'object' ? dms[2].num / dms[2].den : parseFloat(dms[2]);
        
        if (isNaN(deg) || isNaN(min) || isNaN(sec)) return null;
        
        let dd = deg + (min / 60) + (sec / 3600);
        if (hemisphere === 'S' || hemisphere === 'W') dd = -dd;
        
        if (dd < -180 || dd > 180) return null;
        return dd;
    } catch (e) {
        return null;
    }
}

// ============================================
// DISTANCE CALCULATION
// ============================================
function haversineDistance(a, b) {
    const R = 6371; // Earth radius in km
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const x = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// ============================================
// DRAWING
// ============================================
function drawRoute() {
    clearLayers();

    if (routePoints.length === 0) {
        alert('No GPS data found in photos.');
        return;
    }

    const coords = routePoints.map(p => [p.lat, p.lng]);
    
    L.polyline(coords, {
        color: '#FFD700',
        weight: 4,
        opacity: 0.8,
        lineCap: 'round',
        lineJoin: 'round'
    }).addTo(map);

    routePoints.forEach(point => {
        const marker = L.circleMarker([point.lat, point.lng], {
            radius: 6,
            fillColor: '#FFD700',
            color: '#000',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
        });
        
        markers.push(marker);
        marker.addTo(map);
        
        const dateStr = new Date(point.date).toLocaleDateString();
        marker.bindPopup(`📍 ${dateStr}<br>${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}`);
    });

    map.fitBounds(coords, {
        padding: [60, 60],
        maxZoom: 16
    });
}

function clearLayers() {
    map.eachLayer(layer => {
        if (layer instanceof L.Polyline || layer instanceof L.CircleMarker) {
            map.removeLayer(layer);
        }
    });
    markers = [];
    lines = [];
}

// ============================================
// UI UPDATES
// ============================================
function updateUI(state, message = '') {
    switch (state) {
        case 'loading':
            button.classList.add('active');
            button.innerText = 'Scanning...';
            loader.style.display = 'block';
            progressOuter.style.display = 'block';
            popup.style.display = 'block';
            popupText.textContent = message || 'Scanning...';
            statusEl.textContent = message || 'Scanning...';
            break;
        case 'processing':
            popupText.textContent = message;
            statusEl.textContent = message;
            break;
        case 'complete':
            popupText.textContent = message;
            statusEl.textContent = message;
            setTimeout(() => popup.style.display = 'none', 1500);
            finishButton();
            break;
        case 'error':
            popupText.textContent = message;
            statusEl.textContent = message;
            finishButton();
            break;
    }
}

function updateStatus(text) {
    statusEl.textContent = text;
}

function updateProgress(done, total) {
    const percent = Math.round((done / total) * 100);
    progress.style.width = `${percent}%`;
    statusEl.textContent = `Scanning ${done}/${total} (${percent}%)`;
}

function finishButton() {
    button.classList.remove('active');
    button.innerText = 'Choose Photo Folder';
    loader.style.display = 'none';
    progressOuter.style.display = 'none';
    progress.style.width = '0%';
}

function resetMap() {
    clearLayers();
    routePoints = [];
    updateStatus('Waiting for photos');
}
</script>
</body>
</html>
