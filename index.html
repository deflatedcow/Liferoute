<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Root</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{margin:0;font-family:system-ui}
#panel{
position:absolute;top:0;left:0;width:100%;padding:16px;
background:#fff;z-index:1000;border-radius:0 0 20px 20px;
box-shadow:0 4px 20px rgba(0,0,0,.1)
}
button{
width:100%;padding:16px;border:0;border-radius:16px;
background:#FFD700;font-weight:700;font-size:18px
}
button.active{background:#111;color:#FFD700;transform:scale(.96)}
#status{margin-top:10px;font-size:14px;white-space:pre-wrap}
#loader{
display:none;width:30px;height:30px;margin:10px auto;
border-radius:50%;border:4px solid #ddd;border-top:4px solid #111;
animation:spin .6s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#progressOuter{display:none;height:8px;background:#ddd;border-radius:8px;margin-top:8px}
#progress{height:100%;width:0;background:#111}
#detailsToggle{
display:none;margin-top:8px;background:none;border:1px solid #ccc;
padding:8px;font-size:12px;font-weight:600;border-radius:8px;width:100%
}
#details{
display:none;max-height:180px;overflow-y:auto;margin-top:8px;
font-size:11px;font-family:monospace;background:#f5f5f5;
border-radius:8px;padding:8px;white-space:pre-wrap
}
#map{height:100vh}
</style>
</head>

<body>

<div id="panel">
<h2>Life Root</h2>

<input id="folder" type="file" webkitdirectory multiple hidden>
<button id="button">Choose Photo Folder</button>

<div id="status">Waiting</div>
<div id="loader"></div>

<div id="progressOuter">
<div id="progress"></div>
</div>

<button id="detailsToggle">Show details</button>
<div id="details"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

<script>

const map = L.map("map").setView([20,0],2)

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map)

const folder = document.getElementById("folder")
const button = document.getElementById("button")
const status = document.getElementById("status")
const loader = document.getElementById("loader")
const progress = document.getElementById("progress")
const progressOuter = document.getElementById("progressOuter")
const detailsToggle = document.getElementById("detailsToggle")
const details = document.getElementById("details")

let routePoints = []
let lines = []
let skipLog = []

const FILE_TIMEOUT_MS = 15000

button.onclick = ()=>folder.click()

folder.addEventListener("change", handleFiles)

detailsToggle.onclick = ()=>{
let open = details.style.display==="block"
details.style.display = open ? "none" : "block"
detailsToggle.innerText = open ? "Show details" : "Hide details"
}

async function handleFiles(e){

resetMap()
skipLog=[]
details.innerText=""
detailsToggle.style.display="none"
details.style.display="none"

let files=[...e.target.files]
.filter(f=>f.type.startsWith("image/"))
.slice(0,1200)

if(!files.length)return

button.classList.add("active")
button.innerText="Scanning"
loader.style.display="block"
progressOuter.style.display="block"
status.innerText=`Scanning 0/${files.length}`

try{

let result = await extract(files)
routePoints = result.points

renderDetails(result)

if(!routePoints.length){
status.innerText="No GPS data found in any photo"
return
}

status.innerText="Sorting"
routePoints.sort((a,b)=>a.date-b.date)

status.innerText="Drawing"
await drawRoute()

status.innerText=`${routePoints.length} of ${files.length} photos plotted`

}catch(err){
console.error("Life Root failed:",err)
status.innerText="Something went wrong: "+(err && err.message ? err.message : String(err))
skipLog.push("FATAL ERROR: "+(err && err.stack ? err.stack : String(err)))
renderDetails({noGps:0,timedOut:0,failed:0,unsupported:0})
}finally{
finish()
}

}

function renderDetails(counts){
let lines = []
lines.push(`No GPS data: ${counts.noGps}`)
lines.push(`Timed out: ${counts.timedOut}`)
lines.push(`Unsupported format: ${counts.unsupported}`)
lines.push(`Read errors: ${counts.failed}`)
lines.push("")
lines.push(...skipLog.slice(0,200))
if(skipLog.length>200){
lines.push(`... and ${skipLog.length-200} more`)
}
details.innerText = lines.join("\n")
detailsToggle.style.display = "block"
}

async function extract(files){

let results=[]
let done=0
let noGps=0
let timedOut=0
let unsupported=0
let failed=0

async function worker(list){

for(let file of list){

let outcome = await readPhoto(file)

if(outcome.ok){
results.push(outcome.data)
}else{
if(outcome.reason==="noGps")noGps++
else if(outcome.reason==="timeout")timedOut++
else if(outcome.reason==="unsupported")unsupported++
else failed++
skipLog.push(`${file.name}: ${outcome.reason}${outcome.detail ? " - "+outcome.detail : ""}`)
}

done++
progress.style.width=(done/files.length*100)+"%"
status.innerText=`Scanning ${done}/${files.length}`

if(done%5===0){
await new Promise(r=>setTimeout(r,0))
}

}
}

let chunkSize=Math.max(1,Math.ceil(files.length/4))
await Promise.all([
worker(files.slice(0,chunkSize)),
worker(files.slice(chunkSize,chunkSize*2)),
worker(files.slice(chunkSize*2,chunkSize*3)),
worker(files.slice(chunkSize*3))
])

return{points:results,noGps,timedOut,unsupported,failed}

}

async function readPhoto(file){

try{

let data = await Promise.race([
exifr.parse(file,{
tiff:true,
ifd0:true,
exif:true,
gps:true,
interop:false,
thumbnail:false,
xmp:false,
icc:false,
iptc:false,
mergeOutput:true
}),
new Promise((_,reject)=>
setTimeout(()=>reject(new Error("timeout")),FILE_TIMEOUT_MS)
)
])

if(!data){
return{ok:false,reason:"unsupported",detail:"no EXIF block found"}
}

if(data.latitude===undefined){
return{ok:false,reason:"noGps"}
}

return{
ok:true,
data:{
lat:data.latitude,
lng:data.longitude,
date:data.DateTimeOriginal
? new Date(data.DateTimeOriginal)
: new Date(file.lastModified)
}
}

}catch(err){

let msg = err && err.message ? err.message : String(err)

if(msg==="timeout"){
return{ok:false,reason:"timeout"}
}

return{ok:false,reason:"error",detail:msg}

}

}

async function drawRoute(){

lines.forEach(l=>map.removeLayer(l))
lines=[]

let coords = routePoints.map(p=>[p.lat,p.lng])

let line = L.polyline([],{
color:"#FFD700",
weight:4,
opacity:.8
}).addTo(map)

lines.push(line)

let i=0
let batch=25

await new Promise((resolve)=>{

function step(){

let slice = coords.slice(i,i+batch)

slice.forEach(c=>line.addLatLng(c))

i+=batch

if(i<coords.length){

setTimeout(()=>requestAnimationFrame(step),0)

}else{

map.fitBounds(coords,{padding:[40,40]})
resolve()

}

}

step()

})

}

function resetMap(){
lines.forEach(l=>map.removeLayer(l))
lines=[]
routePoints=[]
}

function finish(){
button.classList.remove("active")
button.innerText="Choose Photo Folder"
loader.style.display="none"
progressOuter.style.display="none"
}

</script>

</body>
</html>
