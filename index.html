<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Root</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    font-family:system-ui, Arial, sans-serif;
}


#top {

    position:absolute;
    z-index:1000;

    top:0;
    width:100%;

    padding:16px;

    background:white;

    border-radius:0 0 22px 22px;

    box-shadow:0 3px 15px rgba(0,0,0,.2);

}


h2 {
    margin:0 0 12px;
}


button {

    width:100%;

    padding:16px;

    border:0;

    border-radius:14px;

    background:#FFD700;

    color:#111;

    font-size:18px;

    font-weight:700;

    transition:.25s;

}


button.scanning {

    animation:pulse .8s infinite;

}



@keyframes pulse {

    0% {
        transform:scale(1);
    }

    50% {
        transform:scale(1.05);
    }

    100% {
        transform:scale(1);
    }

}



#status {

    margin-top:12px;

    font-size:14px;

}



.loader {

    display:none;

    width:38px;

    height:38px;

    margin:15px auto;

    border-radius:50%;

    border:5px solid #ddd;

    border-top:5px solid #111;

    animation:spin .35s linear infinite;

}



@keyframes spin {

    from {
        transform:rotate(0deg);
    }

    to {
        transform:rotate(360deg);
    }

}



.progress-container {

    display:none;

    height:10px;

    width:100%;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar {

    width:0%;

    height:100%;

    background:#111;

    transition:.2s;

}



.processing-popup {

    display:none;

    position:absolute;

    z-index:2000;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:25px;

    width:80%;

    max-width:350px;

    text-align:center;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

    font-size:18px;

}



.processing-popup .emoji {

    font-size:40px;

    margin-bottom:10px;

}



#map {

    width:100%;

    height:100vh;

}


</style>

</head>


<body>


<div id="top">


<h2>🌱 Life Root</h2>


<input

id="photos"

type="file"

accept="image/*"

webkitdirectory

directory

multiple

hidden

>


<button id="chooseButton">

Choose Photo Folder

</button>


<div id="status">

Waiting for photos...

</div>


<div id="loader" class="loader"></div>


<div id="progress-container" class="progress-container">

<div id="progress-bar" class="progress-bar"></div>

</div>


</div>



<div id="processing-popup" class="processing-popup">

<div class="emoji">

🌱

</div>


<div id="processing-text">

Growing your route...

</div>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script>


const map = L.map("map")
.setView([20,0],2);



L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);



let points = [];

let drawnPoints = [];

let routeLine = null;



const photos =
document.getElementById("photos");

const chooseButton =
document.getElementById("chooseButton");

const status =
document.getElementById("status");

const loader =
document.getElementById("loader");

const progressBar =
document.getElementById("progress-bar");

const progressContainer =
document.getElementById("progress-container");

const popup =
document.getElementById("processing-popup");

const popupText =
document.getElementById("processing-text");



const cache = new Map();




chooseButton.onclick = ()=>{

    photos.click();

};





photos.addEventListener(
"change",
async function(e){


points=[];

drawnPoints=[];



if(routeLine){

map.removeLayer(routeLine);

routeLine=null;

}



let files =
[...e.target.files]
.filter(file =>
file.type.startsWith("image/")
);



files =
files.slice(0,1000);



if(files.length===0){

alert("No photos found");

return;

}



chooseButton.classList.add("scanning");

chooseButton.innerText =
"Growing Life Root...";



loader.style.display="block";

popup.style.display="block";

progressContainer.style.display="block";



popupText.innerText =
"🔍 Scanning photos...";



let queue=[...files];

let finished=0;



async function worker(){


while(queue.length){


let file =
queue.shift();



try{


let result =
await scanPhoto(file);



if(result){

points.push(result);


points.sort(
(a,b)=>
new Date(a.date)
-
new Date(b.date)
);



addPointToRoute(result);



}



}

catch(err){

console.log(err);

}



finished++;



let percent =
(finished/files.length)*100;


progressBar.style.width =
percent+"%";



if(finished % 10 === 0){


status.innerText =
`Extracting locations ${finished}/${files.length}`;


popupText.innerText =
`📍 Extracting GPS + time

${finished}/${files.length}`;


await new Promise(
r=>setTimeout(r,0)
);


}



}



}





await Promise.all([

worker(),

worker(),

worker(),

worker()

]);




popupText.innerText =
"🗺️ Finishing route...";


status.innerText =
`${points.length} locations found`;



await new Promise(
r=>setTimeout(r,1000)
);



popupText.innerText =
"✨ Route complete";



chooseButton.classList.remove("scanning");

chooseButton.innerText =
"Choose Photo Folder";



setTimeout(()=>{

popup.style.display="none";

loader.style.display="none";

progressContainer.style.display="none";

},1500);



}

);








async function scanPhoto(file){


if(cache.has(file.name)){

return cache.get(file.name);

}



const gps =
await exifr.gps(file);



if(
!gps ||
gps.latitude===undefined ||
gps.longitude===undefined
){

return null;

}



let result={

lat:Number(gps.latitude),

lng:Number(gps.longitude),

date:file.lastModified

};



cache.set(
file.name,
result
);



return result;

}








function interpolate(a,b){


let distance =
Math.sqrt(

Math.pow(a.lat-b.lat,2)+

Math.pow(a.lng-b.lng,2)

);



let steps =
Math.min(
20,
Math.max(
2,
Math.floor(distance*500)
)
);



let result=[];



for(
let i=1;
i<=steps;
i++
){


let t=i/steps;


result.push({

lat:
a.lat+(b.lat-a.lat)*t,

lng:
a.lng+(b.lng-a.lng)*t

});


}



return result;

}








function addPointToRoute(point){



drawnPoints.push(point);



if(drawnPoints.length>1){


let previous =
drawnPoints[
drawnPoints.length-2
];


let smooth =
interpolate(
previous,
point
);



drawnPoints.push(
...smooth
);



}



let coords =
drawnPoints.map(p=>[

p.lat,

p.lng

]);



if(routeLine){

map.removeLayer(routeLine);

}



routeLine =
L.polyline(
coords,
{

color:"#e63946",

weight:5,

opacity:.85

}

)
.addTo(map);



map.fitBounds(
routeLine.getBounds(),
{
padding:[40,40]
}
);



map.invalidateSize();



}





</script>

</body>

</html>
