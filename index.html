<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Root</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    font-family:system-ui, Arial, sans-serif;
}


#top {

    position:absolute;
    z-index:1000;

    top:0;
    width:100%;

    padding:16px;

    background:white;

    border-radius:0 0 22px 22px;

    box-shadow:0 3px 15px rgba(0,0,0,.2);

}


h2 {
    margin:0 0 12px;
}



button {

    width:100%;

    padding:16px;

    border:0;

    border-radius:14px;

    background:#FFD700;

    color:#111;

    font-size:18px;

    font-weight:700;

    transition:.3s;

}



button.scanning {

    background:#222;

    color:#FFD700;

    transform:scale(.97);

}



#status {

    margin-top:12px;

    font-size:14px;

}



.loader {

    display:none;

    width:35px;

    height:35px;

    margin:15px auto;

    border-radius:50%;

    border:5px solid #ddd;

    border-top:5px solid #222;

    animation:spin .5s linear infinite;

}



@keyframes spin {

    from {
        transform:rotate(0deg);
    }

    to {
        transform:rotate(360deg);
    }

}



.progress-container {

    display:none;

    width:100%;

    height:10px;

    margin-top:10px;

    background:#ddd;

    border-radius:10px;

    overflow:hidden;

}



.progress-bar {

    width:0%;

    height:100%;

    background:#222;

}



.popup {

    display:none;

    position:absolute;

    z-index:2000;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    width:80%;

    padding:25px;

    border-radius:20px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

}



#map {

    width:100%;

    height:100vh;

}


</style>

</head>


<body>


<div id="top">

<h2>Life Root</h2>


<input
id="photos"
type="file"
accept="image/*"
webkitdirectory
directory
multiple
hidden
>


<button id="chooseButton">
Choose Photo Folder
</button>


<div id="status">
Waiting for photos
</div>


<div id="loader" class="loader"></div>


<div class="progress-container" id="progressContainer">

<div class="progress-bar" id="progressBar"></div>

</div>


</div>



<div class="popup" id="popup">

<div id="popupText">
Building route
</div>

</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script>

const map = L.map("map")
.setView([20,0],2);


L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);



const photos =
document.getElementById("photos");

const button =
document.getElementById("chooseButton");

const status =
document.getElementById("status");

const loader =
document.getElementById("loader");

const popup =
document.getElementById("popup");

const popupText =
document.getElementById("popupText");

const progressBar =
document.getElementById("progressBar");

const progressContainer =
document.getElementById("progressContainer");



let routeSegments = [];

let currentSegment = [];

let polylines = [];

let cache = new Map();




button.onclick = ()=>{

    photos.click();

};






photos.addEventListener(
"change",
async function(e){


routeSegments=[];

currentSegment=[];


polylines.forEach(
p=>map.removeLayer(p)
);

polylines=[];



let files =
[...e.target.files]
.filter(
f=>f.type.startsWith("image/")
)
.slice(0,1000);



if(!files.length){

alert("No photos found");

return;

}



button.classList.add("scanning");

button.innerText =
"Scanning";



loader.style.display="block";

popup.style.display="block";

progressContainer.style.display="block";



popupText.innerText =
"Extracting photo data";



let photosWithData=[];



for(
let i=0;
i<files.length;
i++
){


let result =
await scanPhoto(files[i]);



if(result){

photosWithData.push(result);

}



progressBar.style.width =
((i+1)/files.length*100)+"%";



status.innerText =
`Extracting ${i+1}/${files.length}`;


}



photosWithData.sort(
(a,b)=>
a.date-b.date
);



popupText.innerText =
"Building route";



for(
let i=0;
i<photosWithData.length;
i++
){


addToRoute(
photosWithData[i]
);



}



popupText.innerText =
"Complete";


status.innerText =
`${photosWithData.length} locations found`;



button.classList.remove("scanning");

button.innerText =
"Choose Photo Folder";



setTimeout(()=>{

popup.style.display="none";

loader.style.display="none";

progressContainer.style.display="none";

},1500);



}

);







async function scanPhoto(file){



if(cache.has(file.name)){

return cache.get(file.name);

}



let gps =
await exifr.gps(file);



let date =
await exifr.parse(
file,
[
"DateTimeOriginal"
]
);



if(
!gps ||
gps.latitude===undefined
){

return null;

}



let result={

lat:Number(gps.latitude),

lng:Number(gps.longitude),

date:
date?.DateTimeOriginal
?
new Date(date.DateTimeOriginal)
:
new Date(file.lastModified)

};



cache.set(
file.name,
result
);



return result;

}







function distance(a,b){


let R=6371;


let dLat =
(b.lat-a.lat)
*
Math.PI/180;


let dLng =
(b.lng-a.lng)
*
Math.PI/180;



let x =
Math.sin(dLat/2)**2
+
Math.cos(a.lat*Math.PI/180)
*
Math.cos(b.lat*Math.PI/180)
*
Math.sin(dLng/2)**2;



return R *
2 *
Math.atan2(
Math.sqrt(x),
Math.sqrt(1-x)
);


}







function addToRoute(point){



if(!currentSegment.length){

currentSegment.push(point);

draw();

return;

}



let last =
currentSegment[
currentSegment.length-1
];



let km =
distance(
last,
point
);



let hours =
(point.date-last.date)
/3600000;



/*
new trip if:

- more than 100km jump
- more than 12 hour gap
*/


if(
km>100 ||
hours>12
){


routeSegments.push(
currentSegment
);


currentSegment=[];


}



currentSegment.push(point);


draw();


}







function draw(){



let all =
[
...routeSegments,
currentSegment
];



polylines.forEach(
p=>map.removeLayer(p)
);


polylines=[];



all.forEach(segment=>{


if(segment.length<2){

return;

}



let coords =
segment.map(
p=>[
p.lat,
p.lng
]
);



let line =
L.polyline(
coords,
{
color:"#222",
weight:5
}
)
.addTo(map);



polylines.push(line);



});



let bounds =
L.featureGroup(
polylines
)
.getBounds();



if(bounds.isValid()){

map.fitBounds(
bounds,
{
padding:[40,40]
}
);

}



map.invalidateSize();



}



</script>

</body>

</html>
