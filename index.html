<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Route</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    font-family:system-ui, Arial, sans-serif;
}


#top {

    position:absolute;
    z-index:1000;

    top:0;
    width:100%;

    padding:16px;

    background:white;

    border-radius:0 0 22px 22px;

    box-shadow:0 3px 15px rgba(0,0,0,.2);

}


h2 {
    margin:0 0 12px;
}


button {

    width:100%;

    padding:16px;

    border:0;

    border-radius:14px;

    background:#FFD700;

    color:#111;

    font-size:18px;

    font-weight:700;

}


#status {

    margin-top:12px;

    font-size:14px;

}



.loader {

    display:none;

    width:38px;

    height:38px;

    margin:15px auto;

    border-radius:50%;

    border:5px solid #ddd;

    border-top:5px solid #111;

    animation:spin .35s linear infinite;

}


@keyframes spin {

    from {
        transform:rotate(0deg);
    }

    to {
        transform:rotate(360deg);
    }

}



.progress-container {

    display:none;

    height:10px;

    width:100%;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar {

    width:0%;

    height:100%;

    background:#111;

    transition:.2s;

}



.processing-popup {

    display:none;

    position:absolute;

    z-index:2000;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:25px;

    border-radius:20px;

    width:80%;

    max-width:350px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

    font-size:18px;

}



.processing-popup .emoji {

    font-size:40px;

    margin-bottom:10px;

}



#map {

    width:100%;

    height:100vh;

}


</style>

</head>


<body>


<div id="top">

<h2>🌍 Life Route</h2>


<input
id="photos"
type="file"
accept="image/*"
webkitdirectory
directory
multiple
hidden
>


<button onclick="photos.click()">
Choose Photo Folder
</button>


<div id="status">
Waiting for photos...
</div>


<div id="loader" class="loader"></div>


<div id="progress-container" class="progress-container">

<div id="progress-bar" class="progress-bar"></div>

</div>


</div>



<div id="processing-popup" class="processing-popup">

<div class="emoji">
🌎
</div>

<div id="processing-text">
Preparing your life route...
</div>

</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script>


const map = L.map("map")
.setView([20,0],2);



L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);



let points=[];



const status =
document.getElementById("status");

const loader =
document.getElementById("loader");

const progressContainer =
document.getElementById("progress-container");

const progressBar =
document.getElementById("progress-bar");

const processingPopup =
document.getElementById("processing-popup");

const processingText =
document.getElementById("processing-text");



const cache = new Map();




photos.addEventListener(
"change",
async function(e){


points=[];


let files =
[...e.target.files]
.filter(file =>
file.type.startsWith("image/")
);



const limit =
Math.min(files.length,1000);



files =
files.slice(0,limit);



if(files.length===0){

alert("No photos found");

return;

}



loader.style.display="block";

progressContainer.style.display="block";

processingPopup.style.display="block";


progressBar.style.width="0%";


processingText.innerText =
"🔍 Scanning photos...";


status.innerText =
`Found ${limit} photos`;



let queue=[...files];

let completed=0;



async function worker(){


while(queue.length){


const file =
queue.shift();



try{


const result =
await scanPhoto(file);



if(result){

points.push(result);

}


}

catch(err){

console.log(
"Skipped:",
file.name
);

}



completed++;



const percent =
(completed / limit) * 100;


progressBar.style.width =
percent+"%";



if(completed % 10 === 0){


status.innerText =
`Scanning ${completed}/${limit} photos`;


processingText.innerText =
`📍 Extracting locations and dates

${completed}/${limit}`;


await new Promise(
r=>setTimeout(r,0)
);


}



}



}



await Promise.all([

worker(),
worker(),
worker(),
worker()

]);




points.sort(

(a,b)=>

new Date(a.date)
-
new Date(b.date)

);




loader.style.display="none";


processingText.innerText =
"🗺️ Drawing your life route...";


status.innerText =
`${points.length} locations found`;



await new Promise(
r=>setTimeout(r,800)
);



drawRoute();



processingText.innerText =
`✨ Done!

${points.length} memories mapped`;



setTimeout(()=>{

processingPopup.style.display="none";

},2000);



progressContainer.style.display="none";



}

);







async function scanPhoto(file){



if(cache.has(file.name)){

return cache.get(file.name);

}




const gps =
await exifr.gps(file);



if(
!gps ||
gps.latitude===undefined ||
gps.longitude===undefined
){

return null;

}



const result = {


lat:Number(gps.latitude),


lng:Number(gps.longitude),


date:file.lastModified


};



cache.set(
file.name,
result
);



return result;



}







function drawRoute(){



if(points.length===0){

alert(
"No GPS data found"
);

return;

}



const coords =
points.map(p=>[

p.lat,

p.lng

]);



console.log(
"Drawing route:",
coords
);





const route =
L.polyline(
coords,
{

color:"red",

weight:6,

opacity:0.85

}

)
.addTo(map);





L.circleMarker(

coords[0],

{

radius:10,

color:"green"

}

)

.addTo(map)

.bindPopup(
"🚀 Start"
);





L.circleMarker(

coords[coords.length-1],

{

radius:10,

color:"red"

}

)

.addTo(map)

.bindPopup(
"🏁 Latest"
);





map.fitBounds(

route.getBounds(),

{

padding:[60,60]

}

);



setTimeout(()=>{

map.invalidateSize();

},500);



}



</script>


</body>

</html>
