<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liferoute</title><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"><style>
body{margin:0;font-family:system-ui}
#panel{
position:absolute;bottom:0;left:0;width:100%;padding:16px;
background:#fff;z-index:1000;border-radius:20px 20px 0 0;
box-shadow:0 -4px 20px rgba(0,0,0,.1)
}
h2{margin-top:0}
button{
width:100%;padding:16px;border:0;border-radius:16px;
background:#FFD700;font-weight:700;font-size:18px;
transition:transform .12s ease, background .12s ease;
}
button:active{transform:scale(.94)}
button.active{background:#111;color:#FFD700;transform:scale(.96)}
#status{margin-top:10px;font-size:14px;white-space:pre-wrap}
#loader{
display:none;width:30px;height:30px;margin:10px auto;
border-radius:50%;border:4px solid #ddd;border-top:4px solid #111;
animation:spin .6s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#progressOuter{display:none;height:8px;background:#ddd;border-radius:8px;margin-top:8px}
#progress{height:100%;width:0;background:#111;transition:width .15s ease}
#detailsToggle{
display:none;margin-top:8px;background:#f0f0f0;border:1px solid #ddd;
padding:12px;font-size:13px;font-weight:600;border-radius:12px;width:100%;
}
#details{
display:none;max-height:180px;overflow-y:auto;margin-top:8px;
font-size:11px;font-family:monospace;background:#f5f5f5;
border-radius:8px;padding:8px;white-space:pre-wrap
}
#map{height:100vh}
</style></head><body><div id="map"></div><div id="panel">
<h2>Liferoute</h2><input id="folder" type="file" webkitdirectory multiple hidden>
<button id="button">Choose Photo Folder</button><div id="status">Waiting</div>
<div id="loader"></div><div id="progressOuter">
<div id="progress"></div>
</div><button id="detailsToggle">Show details</button>

<div id="details"></div>
</div><script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script><script>

const map = L.map("map",{zoomControl:false}).setView([20,0],2)
L.control.zoom({position:"topright"}).addTo(map)
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map)

const folder = document.getElementById("folder")
const button = document.getElementById("button")
const status = document.getElementById("status")
const loader = document.getElementById("loader")
const progress = document.getElementById("progress")
const progressOuter = document.getElementById("progressOuter")
const detailsToggle = document.getElementById("detailsToggle")
const details = document.getElementById("details")

let routePoints = []
let lines = []
let skipLog = []

button.onclick = ()=>folder.click()
folder.addEventListener("change", handleFiles)

detailsToggle.onclick = ()=>{
let open = details.style.display==="block"
details.style.display = open ? "none" : "block"
detailsToggle.innerText = open ? "Show details" : "Hide details"
}

function isValidCoord(lat,lng){
return lat && lng && lat<=90 && lat>=-90 && lng<=180 && lng>=-180
}

function isJump(a,b){
return Math.abs(a.lat-b.lat)>5 || Math.abs(a.lng-b.lng)>5
}

async function handleFiles(e){

resetMap()
skipLog=[]
details.innerText=""
detailsToggle.style.display="none"

let files=[...e.target.files]
.filter(f=>f.type.startsWith("image/"))
.slice(0,1200)

if(!files.length)return

button.classList.add("active")
button.innerText="Scanning"
loader.style.display="block"
progressOuter.style.display="block"

let result = await extract(files)
routePoints = result.points

if(!routePoints.length){
status.innerText="No GPS data found"
finish()
return
}

routePoints.sort((a,b)=>a.date-b.date)

status.innerText="Drawing"
await drawRoute()

status.innerText=`${routePoints.length} photos plotted`
finish()
}

async function extract(files){

let results=[]

for(let i=0;i<files.length;i++){

let file = files[i]

try{
let data = await exifr.parse(file)

if(!data || !isValidCoord(data.latitude,data.longitude)){
skipLog.push(file.name+" no gps")
}else{
results.push({
lat:data.latitude,
lng:data.longitude,
date:new Date(data.DateTimeOriginal || file.lastModified)
})
}
}catch{
skipLog.push(file.name+" error")
}

status.innerText=`Scanning ${i+1}/${files.length}`
progress.style.width=((i+1)/files.length*100)+"%"

if(i%10===0){
await new Promise(r=>setTimeout(r,0))
}
}

return{points:results}
}

async function drawRoute(){

lines.forEach(l=>map.removeLayer(l))
lines=[]

if(routePoints.length<2)return

let segments=[]
let current=[routePoints[0]]

for(let i=1;i<routePoints.length;i++){

if(isJump(routePoints[i-1],routePoints[i])){
segments.push(current)
current=[routePoints[i]]
}else{
current.push(routePoints[i])
}

}

segments.push(current)

for(let seg of segments){

let coords = seg.map(p=>[p.lat,p.lng])

let line = L.polyline(coords,{
color:"#FFD700",
weight:4,
opacity:.8
}).addTo(map)

lines.push(line)

await new Promise(r=>setTimeout(r,0))
}

map.fitBounds(routePoints.map(p=>[p.lat,p.lng]),{padding:[40,40]})
}

function resetMap(){
lines.forEach(l=>map.removeLayer(l))
lines=[]
routePoints=[]
}

function finish(){
button.classList.remove("active")
button.innerText="Choose Photo Folder"
loader.style.display="none"
progressOuter.style.display="none"
}

</script></body>
</html>
